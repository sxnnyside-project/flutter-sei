name: flutter_sei
description: >-
  Flutter widgets for Sxnnyside Eloquent Icons (SEI), a curated,
  platform-agnostic SVG icon system with outline and filled styles.
version: 2.0.0
homepage: https://github.com/sxnnyside-project/flutter-sei
repository: https://github.com/sxnnyside-project/flutter-sei
issue_tracker: https://github.com/sxnnyside-project/flutter-sei/issues
topics:
  - icons
  - svg
  - widgets

environment:
  sdk: ^3.9.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/outline/
    - assets/filled/
